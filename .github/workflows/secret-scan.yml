name: secret-scan

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits being added, so an old, already-rotated key in
      # history does not fail every later run. A brand-new branch has no
      # "before" commit, so its whole history is scanned instead.
      - name: gitleaks on the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITLEAKS_VERSION: '8.21.2'
        run: |
          set -eu
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            ./gitleaks detect --source . --redact --no-banner --verbose
          else
            ./gitleaks detect --source . --log-opts "${base}..HEAD" --redact --no-banner --verbose
          fi
